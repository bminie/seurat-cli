name: Nextflow

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The jobs only read the repository
permissions:
  contents: read

jobs:
  lint:
    name: Nextflow Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nextflow
        uses: nf-core/setup-nextflow@c66f1bfa2dc817ae23f4b34eaa26fa5f1453ca71 # v3.1.0

      - name: Check Nextflow version
        run: nextflow -version

      - name: Lint pipeline (strict syntax)
        run: |
          cd workflows/nextflow
          nextflow lint main.nf nextflow.config

      - name: Validate pipeline syntax
        run: |
          cd workflows/nextflow
          nextflow run main.nf --help

      - name: Run dry-run with test profile
        run: |
          cd workflows/nextflow
          nextflow run main.nf -profile test -preview
        continue-on-error: true  # Preview may not work on all Nextflow versions

  config-check:
    name: Config Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nextflow
        uses: nf-core/setup-nextflow@c66f1bfa2dc817ae23f4b34eaa26fa5f1453ca71 # v3.1.0

      - name: Validate config syntax
        run: |
          cd workflows/nextflow
          nextflow config main.nf -profile test
