name: R Syntax Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The jobs only read the repository
permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    
    - name: Set up R
      uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
      with:
        r-version: '4.3'
    
    - name: Install dependencies
      run: |
        # lintr is pinned so a new release (with new checks) can't fail the
        # build without a code change
        install.packages(c("optparse", "remotes"))
        remotes::install_version("lintr", version = "3.4.0", upgrade = "never")
      shell: Rscript {0}
    
    - name: Check R syntax
      run: |
        # Check each R file for syntax errors
        files <- list.files(pattern = "\\.R$", recursive = TRUE, full.names = TRUE)
        errors <- c()
        
        for (f in files) {
          tryCatch({
            parse(f)
            message(paste("✓", f))
          }, error = function(e) {
            errors <<- c(errors, paste(f, ":", e$message))
            message(paste("✗", f, "-", e$message))
          })
        }
        
        if (length(errors) > 0) {
          stop(paste("Syntax errors found:\n", paste(errors, collapse = "\n")))
        }
        
        message("\nAll R files have valid syntax!")
      shell: Rscript {0}
    
    - name: Lint R code
      run: |
        library(lintr)
        
        # Custom linters - less strict for scripts
        linters <- linters_with_defaults(
          line_length_linter = line_length_linter(120),
          object_name_linter = NULL,  # Allow flexible naming
          commented_code_linter = NULL,  # Allow commented examples
          # Needs every package the scripts load (Seurat, ggplot2, ...)
          # installed to know their functions, and flags column names in
          # aes() and subset(). Without them it only reports false positives.
          object_usage_linter = NULL
        )
        
        files <- list.files(pattern = "\\.R$", recursive = TRUE, full.names = TRUE)
        
        all_lints <- list()
        for (f in files) {
          lints <- lint(f, linters = linters)
          if (length(lints) > 0) {
            all_lints[[f]] <- lints
          }
        }
        
        if (length(all_lints) > 0) {
          for (f in names(all_lints)) {
            message(paste("\n", f, ":"))
            print(all_lints[[f]])
          }
          stop("Lint issues found (see above)")
        } else {
          message("No lint issues found!")
        }
      shell: Rscript {0}

  help-check:
    runs-on: ubuntu-latest
    needs: syntax-check
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    
    - name: Set up R
      uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
      with:
        r-version: '4.3'
    
    - name: Install optparse
      run: |
        install.packages("optparse")
      shell: Rscript {0}
    
    - name: Verify --help works for all scripts
      run: |
        scripts <- list.files("scripts", pattern = "\\.R$", full.names = TRUE)
        failed <- character()

        for (script in scripts) {
          # system2 records a non-zero exit as a "status" attribute (with a
          # warning) rather than an error, so check the status explicitly
          out <- suppressWarnings(
            system2("Rscript", c(script, "--help"), stdout = TRUE, stderr = TRUE))
          status <- attr(out, "status")

          if (is.null(status) || status == 0) {
            message("✓ ", script)
          } else {
            message("✗ ", script, " (exit ", status, ")")
            message(paste(out, collapse = "\n"))
            failed <- c(failed, script)
          }
        }

        if (length(failed) > 0) {
          stop("--help failed for: ", paste(failed, collapse = ", "))
        }
      shell: Rscript {0}
