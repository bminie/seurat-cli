name: Snakemake

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The jobs only read the repository
permissions:
  contents: read

jobs:
  lint:
    name: Snakemake Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install Snakemake
        # Same version as the image and environment-cloud.yml
        run: pip install snakemake==9.27.1

      - name: Check Snakemake version
        run: snakemake --version

      - name: Lint Snakefile
        run: |
          cd workflows/snakemake
          snakemake --configfile config_demo.yaml --lint

  dry-run:
    name: Dry Run
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install Snakemake
        # Same version as the image and environment-cloud.yml
        run: pip install snakemake==9.27.1

      - name: Dry run with demo config
        run: |
          cd workflows/snakemake
          snakemake --configfile config_demo.yaml --dry-run --printshellcmds

      - name: Dry run the sample_level demo
        run: |
          cd workflows/snakemake
          snakemake --configfile config_demo.yaml --config workflow=sample_level --dry-run

      - name: Validate DAG generation
        run: |
          cd workflows/snakemake
          snakemake --configfile config_demo.yaml --dag > /dev/null
          echo "DAG generation successful"
