name: Demo Tests

# Runs every script on the SeuratData demo datasets and validates the output
# (tests/run_demo_tests.R). This is the only CI job that runs the analyses.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  demo-tests:
    name: Demo tests (scripts 01-06)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        # Login shell so the micromamba environment is active
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4

      - name: Set up R environment (environment-r.yml)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment-r.yml
          cache-environment: true

      - name: Show R and Seurat versions
        run: Rscript -e 'cat(R.version.string, "\nSeurat", as.character(packageVersion("Seurat")), "\n")'

      - name: Install SeuratData and demo datasets
        env:
          # remotes::install_github uses this to avoid GitHub API rate limits
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: Rscript setup.R

      - name: Run demo tests
        run: Rscript tests/run_demo_tests.R

      - name: Upload test logs and tables on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: demo-test-output
          path: |
            test_output/**/*.log
            test_output/**/*.csv
            test_output/**/*.txt
          retention-days: 7
