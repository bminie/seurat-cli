name: Demo Tests

# Runs every script on the SeuratData demo datasets and validates the output
# (tests/run_demo_tests.R). This is the only CI job that runs the analyses.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The jobs only read the repository
permissions:
  contents: read

jobs:
  demo-tests:
    name: Demo tests (scripts 01-08)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        # Login shell so the micromamba environment is active
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up R environment (environment-r.yml)
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: environment-r.yml
          cache-environment: true

      - name: Show R and Seurat versions
        run: Rscript -e 'cat(R.version.string, "\nSeurat", as.character(packageVersion("Seurat")), "\n")'

      # Also installs Seurat 6 from CRAN while conda-forge is on 5.x
      # (install_seurat.R), destiny, and ComplexHeatmap
      - name: Install Seurat 6, SeuratData, and demo datasets
        env:
          # remotes::install_github uses this to avoid GitHub API rate limits
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: Rscript setup.R

      - name: Run demo tests
        run: Rscript tests/run_demo_tests.R

      - name: Upload test logs and tables on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-test-output
          path: |
            test_output/**/*.log
            test_output/**/*.csv
            test_output/**/*.txt
          retention-days: 7
