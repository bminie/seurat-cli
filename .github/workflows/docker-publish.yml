name: Docker Image

# Builds the linux/amd64 image that the pipelines' container modes use
# (Nextflow docker/singularity/apptainer profiles, Snakemake --sdm apptainer),
# smoke-tests it, and publishes it to GitHub Container Registry
# (ghcr.io/<owner>/seurat-cli) and, once set up, Docker Hub
# (docker.io/<user>/seurat-cli). Pull requests build and test without pushing.
#
# Tags: "latest" for main, "1.2.3" and "1.2" for v1.2.3 release tags, and
# "sha-<commit>" for every published build.
#
# Two jobs keep publishing credentials away from everything else:
#   build    builds and smoke-tests; read-only token, no secrets; runs on PRs
#   publish  pushes; runs only for main and v* tags, in the "publish"
#            environment, which holds the Docker Hub token
#
# One-time setup
#   GHCR: the first push creates a private package. Make it public once
#   (package settings on GitHub) so clusters can pull it without logging in.
#
#   Docker Hub (skipped until DOCKERHUB_USERNAME is set):
#   1. Docker Hub > Account settings > Personal access tokens: create a token
#      with "Read & Write" access (not Delete) and an expiration date.
#   2. GitHub > Settings > Environments > New environment "publish".
#      Deployment branches and tags: "Selected branches and tags", add the
#      branch "main" and the tag pattern "v*".
#   3. In that environment add the secret DOCKERHUB_TOKEN (the token) and the
#      variable DOCKERHUB_USERNAME (your Docker Hub username). The username is
#      a variable, not a secret: GitHub masks secret values in every log line,
#      and it would hide the image name in the build logs.
#   Replace the token before it expires; nothing else stores it.
#
# Actions are pinned to commit SHAs so a moved tag can't change what runs
# with publishing credentials. Update them by hand: the version is in the
# comment after each SHA.

on:
  push:
    branches: [main]
    tags: ['v*']
    # Path filters don't apply to tag pushes, so releases always build
    paths:
      - Dockerfile
      - scripts/**
      - utils/**
      - tests/**
      - .github/workflows/docker-publish.yml
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - scripts/**
      - utils/**
      - tests/**
      - .github/workflows/docker-publish.yml
  workflow_dispatch:

# Jobs get only what they ask for below
permissions: {}

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (linux/amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The image is ~5 GB and is held twice (build cache and loaded copy)
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: seurat-cli:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Run as a non-root user, as HPC and the Nextflow docker profile do
      - name: Smoke test
        run: |
          docker run --rm -u 1001:1001 -e HOME=/tmp seurat-cli:test \
            Rscript -e 'cat("Seurat", as.character(packageVersion("Seurat")), "\n")'
          docker run --rm -u 1001:1001 -e HOME=/tmp seurat-cli:test \
            Rscript /app/scripts/01_basic_analysis.R --demo --output /tmp/smoke

  publish:
    name: Publish (GHCR, Docker Hub)
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Environment secrets are only given to the branches and tags the
    # environment allows (main and v*), not to workflows run from other branches
    environment: publish
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Check Docker Hub setup
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_USERNAME is not set in the publish environment; publishing to GHCR only"
          fi

      - name: Image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/seurat-cli
            name=docker.io/${{ vars.DOCKERHUB_USERNAME || 'unset' }}/seurat-cli,enable=${{ steps.dockerhub.outputs.enabled }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Every layer comes from the build job's cache, so this pushes the
      # image that job tested
      - name: Publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
