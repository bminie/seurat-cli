# =============================================================================
# Seurat CLI Snakemake Pipeline Configuration
# =============================================================================
#
# Copy this file and modify for your analysis.
#
# Usage:
#   snakemake --configfile my_config.yaml --cores 4
#
# =============================================================================

# -----------------------------------------------------------------------------
# Workflow Selection
# -----------------------------------------------------------------------------
# Options: basic, sctransform, integration, cell_cycle, full, sample_level, spatial
#
# Workflow paths:
#   basic:        01_basic_analysis → 04_de → 06_visualization
#   sctransform:  02_sctransform → 04_de → 06_visualization
#   integration:  03_integration → 04_de → 06_visualization
#   cell_cycle:   02_sctransform → 05_cell_cycle → 04_de → 06_visualization
#   full:         02_sctransform → 05_cell_cycle → 04_de → 06_visualization
#   sample_level: 03_integration → 07_sample_level (or 07 alone on
#                 sample_level.input_rds)
#   spatial:      08_spatial on input_path (a Xenium or Atera output folder)

workflow: "sctransform"

# -----------------------------------------------------------------------------
# Paths
# -----------------------------------------------------------------------------

# Path to seurat-cli scripts directory (relative to Snakefile or absolute)
scripts_dir: "../../scripts"

# Output directory for all results
output_dir: "results"

# -----------------------------------------------------------------------------
# Input Data
# -----------------------------------------------------------------------------

# For basic/sctransform/cell_cycle workflows - single input
# Can be: 10x directory, .h5 file, .rds file, or .csv
# For the spatial workflow: a Xenium or Atera output folder
input_path: "/path/to/your/data"

# For integration and sample_level workflows - file containing paths (one per
# line) or comma-separated
input_list: "/path/to/sample_list.txt"

# -----------------------------------------------------------------------------
# Common Parameters
# -----------------------------------------------------------------------------

species: "human"  # human or mouse
threads: 4

# -----------------------------------------------------------------------------
# Script-Specific Parameters
# -----------------------------------------------------------------------------

# Basic Analysis (01_basic_analysis.R)
basic:
  min_features: 200
  max_features: 2500
  max_mt: 5
  resolution: 0.5
  dims_use: "1:10"
  extra_args: ""  # Additional arguments to pass

# SCTransform (02_sctransform.R)
sctransform:
  n_variable_features: 3000
  resolution: 0.5
  dims_use: "1:30"
  vars_to_regress: ""  # e.g., "percent.mt" or "percent.mt,nCount_RNA"
  extra_args: ""

# Integration (03_integration.R)
integration:
  method: "CCAIntegration"  # CCAIntegration, RPCAIntegration, HarmonyIntegration, FastMNNIntegration
  normalization: "LogNormalize"  # LogNormalize or SCT
  resolution: 0.5
  dims_use: "1:30"
  sample_names: ""  # Comma-separated, e.g., "Sample1,Sample2,Sample3"
  conditions: ""    # Comma-separated, e.g., "control,treatment,treatment"
  extra_args: ""

# Differential Expression (04_differential_expression.R)
de:
  mode: "all_markers"  # all_markers, between_clusters, between_conditions
  test_use: "wilcox"   # wilcox, t, MAST, DESeq2, negbinom
  logfc_threshold: 0.25
  min_pct: 0.1
  extra_args: ""

# Cell Cycle (05_cell_cycle.R)
cell_cycle:
  regress: false           # Regress out S.Score and G2M.Score
  regress_difference: false # Regress out CC.Difference only (preserves cycling vs non-cycling)
  extra_args: ""

# Visualization (06_visualization.R)
visualization:
  reduction: "umap"
  features: ""  # Comma-separated gene names, e.g., "CD3D,CD4,CD8A,MS4A1"
  extra_args: ""

# Sample-level analysis with scSLIDE (07_sample_level.R)
# Needs at least 4 samples (ideally 10+). By default it runs on the integration
# output, where each input_list entry is one sample and integration.conditions
# gives the response.
sample_level:
  input_rds: ""                    # Existing Seurat RDS to use instead of running integration
  sample_col: "sample"             # 03_integration.R stores sample names here
  response: "condition"            # ... and integration.conditions here
  celltype_col: "seurat_clusters"  # Cell types for DE (clusters if not annotated)
  reduction: "integrated"          # Cell-type embedding
  dims: "1:30"
  traj_dcs: "1"                    # Diffusion components to test, e.g., "1,2"
  latent_vars: ""                  # Sample-level covariates, e.g., "age,sex"
  extra_args: ""

# Imaging spatial analysis (08_spatial.R) on input_path
spatial:
  platform: "auto"         # auto, xenium, atera
  molecules: ""            # Genes whose transcript positions to plot, e.g., "Gad1,Sst"
  crop: ""                 # Zoomed view "xmin,xmax,ymin,ymax" in microns
  normalization: "SCT"     # SCT or LogNormalize
  resolution: 0.3
  extra_args: ""
