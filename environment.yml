# =============================================================================
# Seurat CLI - Full Environment
# =============================================================================
#
# Complete environment with R, Seurat, Snakemake, and Nextflow.
# Use this for running workflow pipelines.
#
# IMPORTANT: Use mamba instead of conda for installation!
# This environment has complex dependencies that can take 30+ minutes with
# conda, or fail entirely. Mamba typically completes in 2-5 minutes.
#
# Installation with mamba (RECOMMENDED):
#   mamba env create -f environment.yml
#   conda activate seurat-cli
#
# Install mamba if needed:
#   conda install -n base -c conda-forge mamba
#
# Installation with conda (slower, may fail):
#   conda env create -f environment.yml
#   conda activate seurat-cli
#
# =============================================================================

name: seurat-cli

channels:
  - conda-forge
  - bioconda

dependencies:
  # R and base packages
  - r-base>=4.2
  - r-essentials

  # Seurat and dependencies
  # seurat-cli needs Seurat >= 6.0. conda-forge may still be on 5.x: after
  # creating the environment, run `Rscript install_seurat.R` (setup.R does
  # this) to build Seurat 6 from CRAN on top of conda's r-seurat.
  - r-seurat>=5.0
  - r-seuratobject>=5.0.2
  # Seurat 6 dependencies that conda's r-seurat 5.x doesn't pull in, and the
  # headers needed to compile it (LinkingTo). RcppThread is also needed, but
  # conda-forge has no osx-arm64 build for current R, so install_seurat.R
  # installs it from CRAN.
  - r-pls
  - r-parallelly
  - r-rcppeigen
  - r-rcppprogress
  - r-rcppannoy
  - r-rspectra

  # Required R packages
  - r-dplyr
  - r-ggplot2
  - r-patchwork
  - r-optparse
  - r-matrix
  - r-future
  - r-viridis
  - r-hdf5r
  - r-r.utils
  - r-png  # Used by tests/validate_outputs.R to check figures are not blank

  # SCTransform dependencies
  - r-sctransform
  - bioconductor-glmgampoi

  # Differential expression packages
  - bioconductor-mast
  - bioconductor-deseq2
  - bioconductor-singlecellexperiment

  # Integration packages
  # (bioconductor-batchelor is omitted: no osx-arm64 build on bioconda.
  #  Install it with BiocManager if needed for FastMNN.)
  - r-harmony

  # Faster marker finding
  - r-presto

  # Seurat 6 features
  # Annotated heatmaps (04 pseudobulk, 07 sample-level)
  - bioconductor-complexheatmap
  - r-circlize
  # 07 sample-level analysis: sparse PLS, and ranger for destiny (destiny
  # itself comes from setup.R: bioconda has no osx-arm64 build, and ranger
  # doesn't compile with conda's clang on macOS)
  - r-spls
  - r-ranger
  # 08 spatial: Parquet (Xenium) and zarr/blosc (Atera) readers; the R blosc
  # package is installed by setup.R and builds against these libraries
  - r-arrow
  - r-data.table
  - r-sf  # zoomed views (--crop)
  - r-jsonlite
  - blosc
  - pkg-config

  # For installing SeuratData from GitHub (via setup.R)
  - r-remotes

  # Workflow managers
  - snakemake>=8.0
  - nextflow>=24.04

  # Java (required for Nextflow)
  - openjdk>=11

  # Snakemake cluster executor (from bioconda rather than pip, so conda
  # keeps its Python deps compatible with snakemake)
  - snakemake-executor-plugin-cluster-generic

  # Utilities
  - graphviz  # For DAG visualization
